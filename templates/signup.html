{% extends "base.html" %}

{% block title %}
Signup
{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', path='css/auth.css') }}">
{% endblock %}

{% block content %}

<div class="auth-page">
    <div class="auth-container">
        <h2>Create Account</h2>
        <form action="/notes" method="post">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your user name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" minlength="6" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm password" minlength="6" required>
            </div>
            <button type="submit">Sign Up</button>
            <div class="login-link">
                Already have an account? <a href="/login">Login</a>
            </div>
        </form>
    </div>
</div>


{% endblock %}
