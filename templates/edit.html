<!DOCTYPE html>
<html>
  <body>

    <h1>Edit Note</h1>

    <form method="POST">

      <input
        type="text"
        name="title"
        value="{{ note.title }}"
      >

      <br><br>

      <textarea name="desc">{{ note.desc }}</textarea>

      <br><br>

      <button type="submit">
        Update Note
      </button>

    </form>

  </body>
</html>
