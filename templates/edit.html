{% extends "base.html" %}

{% block title %}
Edit Note
{% endblock %}

{% block content %}

<form method="POST">
  <label for="note_title" class="form-label">Note Title</label>
  <br>
  <input
    type="text"
    class="form-control"
    name="title"
    value="{{ note.title }}"
  >

  <br>
  <label for="note_content" class="form-label">Note Content</label>
      <textarea name="content" class="form-control">{{ note.content }}</textarea>

      <br>

      <input type="checkbox" name="important" value="on" 
      {% if note.important %}
      checked
      {% endif %}
      >
      <label class="form-check-label" for="important">Is the note IMPORTANT?</label>




      <br><br>
      <button type="submit" class="btn btn-primary">Update Note</button>

    </form>

{% endblock %}
