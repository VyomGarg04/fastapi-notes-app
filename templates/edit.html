{% extends "base.html" %}

{% block title %}
Edit Note
{% endblock %}

{% block content %}

<form method="POST">

      <input
        type="text"
        name="title"
        value="{{ note.title }}"
      >

      <br><br>

      <textarea name="desc">{{ note.desc }}</textarea>

      {% if note.important %}
      checked
      {% endif %}

      <br><br>

      <button type="submit">
        Update Note
      </button>

    </form>

{% endblock %}
